[package]
name = "tntl-desktop"
version = "7.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Separate workspace: this crate needs the webkit toolchain and must not be
# built by `cargo build --workspace` or CI.
[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tntl-app = { path = "../../../crates/tntl-app" }
tntl-modrinth = { path = "../../../crates/tntl-modrinth" }
tntl-doctor = { path = "../../../crates/tntl-doctor" }
tntl-instance = { path = "../../../crates/tntl-instance" }
tntl-launch = { path = "../../../crates/tntl-launch" }
tntl-resolve = { path = "../../../crates/tntl-resolve" }
tntl-source = { path = "../../../crates/tntl-source" }
tntl-store = { path = "../../../crates/tntl-store" }
tntl-status = { path = "../../../crates/tntl-status" }
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.35", default-features = false, features = ["system"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
