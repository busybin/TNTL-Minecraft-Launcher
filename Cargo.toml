[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "4.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
md-5 = "0.10"
png = "0.18"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
